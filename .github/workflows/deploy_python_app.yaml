name: deploy_python_app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: python-app
  ACR: acruksmgmt
  HELM_CHART_PATH: charts/python-app
  HELM_RELEASE_NAME: python-app
  K8S_NAMESPACE: python-app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ env.ACR }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.ACR }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            --push .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.event.client_payload.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.event.client_payload.environment || 'dev' }}"
          case "$ENV" in
            prod) CLUSTER=prod-k8s-aks; RG=prod-k8s-rg;;
            uat)  CLUSTER=test-k8s-aks; RG=test-k8s-rg;;
            *)    CLUSTER=dev-k8s-aks;  RG=dev-k8s-rg;;
          esac
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ steps.env.outputs.rg }} --name ${{ steps.env.outputs.cluster }} --overwrite-existing

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            -f ${{ env.HELM_CHART_PATH }}/values-${{ steps.env.outputs.name }}.yaml \
            --set image.repository=${{ env.ACR }}.azurecr.io/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait \
            --timeout 300s

      - name: Verify deployment
        run: kubectl rollout status deployment -l app.kubernetes.io/instance=${{ env.HELM_RELEASE_NAME }} -n ${{ env.K8S_NAMESPACE }} --timeout=120s
